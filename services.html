<body class="bg-[#0B0F19] text-white">
    <!-- Navigation -->
    <nav id="navbar" class="fixed top-0 left-0 right-0 z-50 bg-[#0B0F19]/95 backdrop-blur-sm border-b border-gray-800">

    <!-- Hero Section -->
    <section class="pt-32 pb-16 px-6 relative overflow-hidden">

        </div>
        <div class="max-w-7xl mx-auto relative z-10">

            <p class="text-xl text-gray-400 max-w-3xl">Comprehensive Microsoft 365 solutions tailored for enterprise success. 18+ years of expertise delivering results.</p>

    </section>

    <!-- Services Grid -->
    <section class="py-16 px-6">
        <div class="max-w-7xl mx-auto">
            <div class="grid md:grid-cols-2 lg:grid-cols-3 gap-8" id="services-grid"></div>
        </div>
    </section>

    <!-- CTA Section -->
    <section class="py-24 px-6 bg-[#0D121E]">
        <div class="max-w-4xl mx-auto text-center">
            <h2 class="text-4xl font-bold mb-6 gradient-text">Need a Custom Solution?</h2>
            <p class="text-xl text-gray-400 mb-8">Discuss your specific requirements with 18+ years of expertise</p>
            <a href="contact.html" class="px-8 py-4 bg-[#0078D4] hover:bg-[#005a9e] text-white font-semibold rounded-lg transition-all duration-300 glow-border inline-flex items-center gap-2">
                <i data-lucide="calendar" class="w-5 h-5"></i>
                Get Custom Quote
            </a>
        </div>
    </section>

    <!-- Footer -->
    <footer id="footer" class="bg-[#0D121E] border-t border-gray-800"></footer>

    <script src="navigation.js"></script>
    <script src="footer.js"></script>
    <script src="services-data.js"></script>
    <script>
        // Load all services
        document.addEventListener('DOMContentLoaded', function() {
            const servicesGrid = document.getElementById('services-grid');
            
            servicesData.forEach(service => {
                servicesGrid.innerHTML += `
                    <div class="p-8 bg-[#0D121E] border border-gray-800 rounded-lg hover:border-[#0078D4] transition-all duration-300">
                        <i data-lucide="${service.lucideIcon}" class="w-12 h-12 mb-4 text-[#0078D4]"></i>
                        <h3 class="text-xl font-semibold mb-3 text-white">${service.name}</h3>
                        <p class="text-gray-400 mb-4">${service.description}</p>
                        <p class="text-gray-500 text-sm mb-4">${service.details}</p>
                        <a href="contact.html?service=${encodeURIComponent(service.name)}" class="text-[#0078D4] hover:text-[#005a9e] font-medium inline-flex items-center gap-2">
                            Request Service
                            <i data-lucide="arrow-right" class="w-4 h-4"></i>
                        </a>
                    </div>
                `;
            });
            
            // Initialize Lucide icons
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
        });
    </script>
    <script src="theme.js"></script>
